<div class="flex h-full flex-col px-8 py-8">
  <div>
    <div class="flex flex-col items-center">
      <img src="/assets/Logo.webp" class="h-24 w-auto" alt="Rose" />

      <a
        routerLink="/"
        class="mt-6 flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-[#b3262d] text-white font-bold no-underline"
        (click)="closeSidebar.emit()"
      >
        <lucide-icon [name]="icons.Flower"></lucide-icon>
        Preview Website
      </a>
    </div>

    <nav class="mt-10 flex flex-col gap-2">
      @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-[#f8eaea] text-[#b3262d]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex h-12 items-center gap-3 rounded-xl px-4 font-semibold no-underline hover:bg-[#f8eaea]"
        (click)="closeSidebar.emit()"
      >
        <lucide-icon [name]="item.icon"></lucide-icon>
        {{ item.label }}
      </a>
      }
    </nav>
  </div>

  <div class="border-t border-gray-200 pt-5 mt-auto">
    <div class="flex items-center gap-3">
      <img
        src="/assets/Logo.webp"
        class="h-12 w-12 rounded-full"
        alt="Rose App"
      />

      <div class="flex-1">
        <p class="text-sm font-bold">
          {{ currentUser()?.firstName }} {{ currentUser()?.lastName }}
        </p>
        <p class="text-xs text-gray-500">{{currentUser()?.email}}</p>
      </div>

      <div class="relative">
        <button
          type="button"
          (click)="menu.toggle($event)"
          class="p-1 rounded hover:bg-gray-200"
        >
          <i>
            <lucide-icon
              [name]="icons.EllipsisVertical"
              class="w-4 h-4 lg:w-5 lg:h-5 text-gray-400 cursor-pointer"
            ></lucide-icon>
          </i>
        </button>
        <p-menu
          #menu
          [model]="items"
          class="w-44 bg-white rounded-lg shadow divide-y divide-gray-100"
          [popup]="true"
          appendTo="body"
          [baseZIndex]="1000"
        >
          <ng-template let-item pTemplate="item">
            <a
              [routerLink]="item.routerLink"
              (click)="item.command?.()"
              class="flex items-center cursor-pointer gap-2 p-2 border-b border-b-[#F3F4F6] text-[#1F2937] hover:bg-gray-100"
            >
              <img
                [src]="item.image"
                class="w-[18px] h-[18px]"
                alt="{{ item.label }}"
              />

              <span class="flex-1 whitespace-nowrap hidden sm:block"
                >{{ item.label }}</span
              >
            </a>
          </ng-template>
        </p-menu>
      </div>
    </div>
  </div>
</div>
