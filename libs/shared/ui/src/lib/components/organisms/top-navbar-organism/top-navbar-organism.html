<nav
  class="py-3 px-7 bg-[var(--bg-page)] text-[var(--text-main-color)] flex justify-between items-center"
>
  <lib-logo-atom
    imgClass=" max-w-[45px] max-h-[40px]  md:max-w-[65px] md:max-h-[60px]"
  ></lib-logo-atom>
  @if (isAuthenticated) {
  <div
    class="location hidden md:block flex flex-col justify-center items-center"
  >
    <span class="text-gray-600">Deliver to:</span>
    <div class="flex justify-center items-center text-[#741C21]">
      <lucide-icon [name]="icons.MapPinPen" class="w-5 h-5"></lucide-icon>
      <span class="text-[#741C21] font-medium">Cairo</span>
    </div>
  </div>
  }
  <lib-search-input-molecule
    placeholder="What awesome gift are you looking for?"
    [widthClass]="
    isAuthenticated
      ? ' md:w-[330px] lg:w-[840px]'
      : ' md:w-[290px] lg:w-[940px]'
  "
    inputClass="flex items-center bg-[var(--input-bg)] text-[var-(--shop-main-color)] h-[52px] gap-2 rounded-[10px] border border-[#D4D4D8] p-4 outline-none focus:border-0 focus:ring-1 focus:ring-[var(--shop-main-color)]"
  ></lib-search-input-molecule>
  <div class="ations flex items-center justify-center">
    @if (isAuthenticated) {
    <div class="flex items-center justify-center">
      <div
        class="text-left px-1 md:px-3 flex justify-center items-center cursor-pointer"
      >
        <lib-authenticated-menu-molecule
          [userName]="user?.firstName ?? ''"
          (logout)="logout.emit()"
        ></lib-authenticated-menu-molecule>
      </div>
      <lib-nav-user-data-molecule
        [isAuthenticated]="true"
        [favCount]="favCount"
        [cartCount]="cartCount"
      ></lib-nav-user-data-molecule>
    </div>
    } @if(!isAuthenticated) {
    <div class="flex items-center justify-center">
      <a
        routerLink="/auth/login"
        class="cursor-pointer px-3 border-e border-[#E4E4E7] flex justify-center items-center"
      >
        <lucide-icon [name]="icons.User" class="w-5 h-5"></lucide-icon>
        Login
      </a>

      <lib-nav-user-data-molecule
        [isAuthenticated]="false"
        [cartCount]="cartCount"
      ></lib-nav-user-data-molecule>
    </div>
    }
    <lib-lang-switch-atom
      class="border-e border-[#E4E4E7] px-2"
    ></lib-lang-switch-atom>
    <button class="cursor-pointer ps-2" (click)="toggleTheme()">
      <lucide-icon
        [name]="isDark() ? icons.SunMoon : icons.Moon"
        class="w-5 h-5"
      ></lucide-icon>
    </button>
  </div>
</nav>
