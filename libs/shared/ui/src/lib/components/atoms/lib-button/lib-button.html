<button
  [type]="type()"
  [disabled]="disabled() || isLoading()"
  (click)="onClick($event)"
  [class.is-loading]="isLoading()"
  [ngClass]="buttonClasses()"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-busy]="isLoading()"
>
  @if (showLabel()) {
  <span class="button-label">{{ label() }}</span>
  } @if (isLoading()) {
  <lucide-angular
    [img]="LoaderCircle"
    class="button-icon animate-spin"
    [size]="iconSize()"
  ></lucide-angular>
  } @else if (icon() && iconPos() === 'left') {
  <lucide-angular
    [img]="icon()!"
    class="button-icon"
    [size]="iconSize()"
  ></lucide-angular>
  }

  <ng-content></ng-content>

  @if (!isLoading() && icon() && iconPos() === 'right') {
  <lucide-angular
    [img]="icon()!"
    class="button-icon"
    [size]="iconSize()"
  ></lucide-angular>
  }
</button>
