<div class="lib-phone-input">
  <div class="phone-select">
    <lib-select-input
      [options]="countryOptions()"
      optionLabel="label"
      optionValue="code"
      [ngModel]="countryCode()"
      (ngModelChange)="onCountryCodeChange($event)"
      [disabled]="isDisabled()"
    />
  </div>

  <div class="phone-number">
    <lib-custom-input
      type="tel"
      [placeholder]="phonePlaceholder"
      [ngModel]="number()"
      (ngModelChange)="onPhoneNumberChange($event)"
      [disabled]="isDisabled()"
    />
  </div>
</div>
