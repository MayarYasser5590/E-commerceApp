<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <div class="mb-4 flex items-center justify-between gap-3 lg:hidden">
    <p class="text-sm font-medium text-[#741C21]">
      {{ totalProducts() }} products
    </p>
    <button
      type="button"
      class="rounded-md border border-[#F2DCDD] bg-white px-4 py-2 text-sm font-semibold text-[#741C21] shadow-sm transition hover:bg-[#FBEAEA]"
      (click)="filtersOpen.set(true)"
    >
      Filters
    </button>
  </div>

  <div class="grid gap-6 lg:grid-cols-[18rem_minmax(0,1fr)] lg:items-start">
    <lib-product-filter-sidebar
      [categories]="categories()"
      [occasions]="occasions()"
      [selectedFilters]="selectedFilters()"
      [priceRange]="priceRange()"
      [ratingOptions]="ratingOptions"
      [isOpen]="filtersOpen()"
      (filtersChange)="onFiltersChange($event)"
      (resetGroup)="resetFilterGroup($event)"
      (resetAll)="resetAllFilters()"
      (closeFilters)="filtersOpen.set(false)"
    ></lib-product-filter-sidebar>

    <div class="min-w-0">
      @if (products().length) {
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
        @for(product of products(); track product._id){

        <lib-product-card-molecule
          [product]="product"
          (addToCart)="addToCart($event)"
          (addToWishlist)="onToggleWishlist($event)"
        ></lib-product-card-molecule>

        }
      </div>
      } @else {
      <div
        class="flex min-h-80 items-center justify-center rounded-lg border border-dashed border-[#F2DCDD] bg-[#FFFBFB] p-8 text-center"
      >
        <div class="space-y-3">
          <h2 class="text-lg font-semibold text-[#741C21]">
            No products match these filters
          </h2>
          <button
            type="button"
            class="rounded-md bg-[#A6252A] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#741C21]"
            (click)="resetAllFilters()"
          >
            Reset filters
          </button>
        </div>
      </div>
      } @if (totalProducts() > rows) {
      <div class="mt-8 flex justify-center">
        <p-paginator
          [rows]="rows"
          [totalRecords]="totalProducts()"
          [first]="(page() - 1) * rows"
          (onPageChange)="onPageChange($event)"
        >
        </p-paginator>
      </div>
      }
    </div>
  </div>
</div>
