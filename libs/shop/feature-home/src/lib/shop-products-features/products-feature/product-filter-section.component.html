<section
  class="border-[#F2DCDD]"
  [class.border-b]="bordered()"
  [class.pb-5]="!withTopPadding()"
  [class.py-5]="withTopPadding()"
>
  <div class="mb-3 flex items-center justify-between gap-3">
    <h2 class="text-sm font-semibold text-[#2F1A1B]">{{ title() }}</h2>
    <lib-button
      label="x Reset"
      variant="text"
      size="sm"
      customClass="text-xs font-medium text-[#A6252A] hover:text-[#741C21]"
      (clicked)="resetClicked.emit()"
    ></lib-button>
  </div>

  <ng-content></ng-content>
</section>
