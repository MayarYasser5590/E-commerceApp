<article
  class="grid grid-cols-[88px_1fr_auto] gap-4 border-b border-[#F4F4F5] py-4"
>
  <!-- Image -->
  <img
    [src]="product().imgCover"
    [alt]="product().title"
    class="h-24 w-24 rounded-md object-cover"
  />

  <!-- Info -->
  <div class="min-w-0">
    <h2 class="truncate text-base font-semibold">{{ product().title }}</h2>

    <p class="mt-1 text-sm text-[#2563EB]">Rate {{ product().rateAvg }}/5</p>

    <!-- Price -->
    <div class="mt-3 flex items-center gap-2">
      @if (product().priceAfterDiscount) {
      <span class="text-lg font-bold text-[#A6252A]">
        {{ product().priceAfterDiscount }} EGP
      </span>
      <span class="text-sm line-through text-[#71717A]">
        {{ product().price }} EGP
      </span>
      } @else {
      <span class="text-lg font-bold"> {{ product().price }} EGP </span>
      }
    </div>
  </div>

  <!-- Actions -->
  <div class="flex flex-col justify-center w-full gap-2">
    <!-- Remove -->
    <lib-button
      label="Remove"
      variant="custom"
      size="sm"
      [icon]="icons.Trash2"
      customClass="inline-flex w-full items-center justify-center gap-1 rounded-md bg-rose-100 px-3 py-2 text-xs text-red-800 hover:bg-rose-200"
      (clicked)="remove.emit(product()._id)"
    ></lib-button>

    <!-- Add to Cart -->
    <lib-button
      label="Add to Cart"
      variant="custom"
      size="sm"
      [icon]="icons.Plus"
      customClass="inline-flex w-full items-center justify-center gap-1 rounded-md bg-green-100 px-3 py-2 text-xs text-green-800 hover:bg-green-200"
      (clicked)="addToCart.emit(product())"
    ></lib-button>
  </div>
</article>
