<section class="grid gap-[1.15rem]">
  <div class="grid grid-cols-12 items-stretch gap-6">
    <article
      class="relative col-span-12 h-[260px] overflow-hidden rounded-[1.55rem] bg-[#4a1416] text-white shadow-[0_18px_34px_rgba(60,15,18,0.16)] sm:h-[300px] md:h-[340px] lg:col-span-4 lg:h-[380px]"
    >
      <img
        class="absolute inset-0 h-full w-full object-cover"
        [src]="featuredGift.imageSrc"
        [alt]="featuredGift.imageAlt"
      />
      <div
        class="absolute inset-0 bg-gradient-to-b from-[rgba(44,9,10,0.06)] via-[rgba(44,9,10,0.1)] to-[rgba(35,7,8,0.42)]"
      ></div>

      <div
        class="relative z-10 flex h-full flex-col justify-end gap-3 p-5 sm:p-6"
      >
        <span
          class="inline-flex w-fit rounded-full bg-[#fff6f4] px-2.5 py-1 text-[0.58rem] font-semibold leading-none text-[#b22f33] shadow-[0_8px_20px_rgba(39,10,11,0.18)]"
        >
          {{ featuredGift.badge }}
        </span>

        <h2
          class="m-0 max-w-[14rem] text-[2rem] font-semibold leading-[0.92] tracking-[-0.03em] text-white sm:text-[2.1rem]"
        >
          {{ featuredGift.title }}
        </h2>

        <lib-button
          label="Shop Now"
          variant="custom"
          size="md"
          [rounded]="true"
          [icon]="ArrowRightIcon"
          iconPos="right"
          customClass="h-10 w-fit border-0 bg-[#fff2ef] px-4 text-[0.95rem] font-medium text-[#9c272c] shadow-none hover:bg-white"
          (clicked)="goToProducts()"
        ></lib-button>
      </div>
    </article>

    <div
      class="relative col-span-12 h-[260px] sm:h-[300px] md:h-[340px] lg:col-span-8 lg:h-[380px]"
    >
      <p-carousel
        styleClass="special-gifts-carousel h-full"
        [value]="heroSlides"
        [page]="heroPage"
        [numVisible]="1"
        [numScroll]="1"
        [circular]="true"
        [showIndicators]="false"
        [showNavigators]="false"
        (onPage)="onHeroPageChange($event)"
      >
        <ng-template pTemplate="item" let-slide>
          <article
            class="relative h-full overflow-hidden rounded-[1.55rem] text-white shadow-[0_18px_34px_rgba(60,15,18,0.14)]"
          >
            <img
              class="absolute inset-0 h-full w-full object-cover"
              [src]="slide.imageSrc"
              [alt]="slide.imageAlt"
            />
            <div
              class="absolute inset-0"
              [ngClass]="getHeroOverlayClasses(slide.theme)"
            ></div>

            <div class="absolute right-6 top-6 z-20 flex items-center gap-2">
              @for (heroSlide of heroSlides; track $index) {
              <button
                type="button"
                class="block h-2 rounded-full transition-all duration-200"
                [class.w-8]="$index === heroPage"
                [class.bg-[#b52830]]="$index === heroPage"
                [class.w-2]="$index !== heroPage"
                [class.bg-white]="$index !== heroPage"
                [attr.aria-label]="'Go to slide ' + ($index + 1)"
                (click)="goToHeroPage($index)"
              ></button>
              }
            </div>

            <div
              class="relative z-10 flex h-full flex-col justify-end gap-2 p-6 sm:p-7"
            >
              <h3
                class="m-0 max-w-[25rem] text-[2.15rem] font-semibold leading-[0.95] tracking-[-0.03em] text-white sm:text-[2.45rem]"
              >
                {{ slide.title }}
              </h3>
              <p
                class="m-0 text-[1.05rem] font-normal leading-tight text-white/90"
              >
                {{ slide.subtitle }}
              </p>

              <lib-button
                [label]="slide.ctaLabel"
                variant="custom"
                size="md"
                [rounded]="true"
                customClass="mt-4 h-10 w-fit border-0 bg-[#fff2ef] px-4 text-[0.95rem] font-medium text-[#9c272c] shadow-none hover:bg-white"
                (clicked)="goToProducts()"
              ></lib-button>
            </div>
          </article>
        </ng-template>
      </p-carousel>

      <div class="pointer-events-none absolute bottom-6 right-6 z-20">
        <div
          class="pointer-events-auto flex items-center rounded-full bg-[#fff2ef] p-1 shadow-[0_12px_28px_rgba(60,15,18,0.18)]"
        >
          <button
            type="button"
            class="grid h-8 w-8 place-items-center rounded-full text-[#be6562] transition hover:bg-white hover:text-[#a8262b]"
            aria-label="Previous slide"
            (click)="previousHeroSlide()"
          >
            <lucide-angular [img]="ArrowLeftIcon" [size]="18"></lucide-angular>
          </button>
          <button
            type="button"
            class="grid h-8 w-8 place-items-center rounded-full text-[#a8262b] transition hover:bg-white"
            aria-label="Next slide"
            (click)="nextHeroSlide()"
          >
            <lucide-angular [img]="ArrowRightIcon" [size]="18"></lucide-angular>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid gap-[1.15rem] md:grid-cols-2 xl:grid-cols-3">
    @for (card of occasionCards; track card.title) {
    <article
      class="relative min-h-[12.7rem] overflow-hidden rounded-[1.55rem] text-white shadow-[0_18px_34px_rgba(60,15,18,0.12)] sm:min-h-[15.5rem]"
    >
      <img
        class="absolute inset-0 h-full w-full object-cover"
        [src]="card.imageSrc"
        [alt]="card.imageAlt"
      />
      <div
        class="absolute inset-0 bg-gradient-to-b from-[rgba(0,0,0,0.04)] via-[rgba(0,0,0,0.08)] to-[rgba(0,0,0,0.44)]"
      ></div>

      <div class="relative z-10 flex h-full flex-col justify-end gap-2 p-5">
        <span
          class="inline-flex w-fit rounded-full bg-[#fff4f3] px-2.5 py-1 text-[0.58rem] font-semibold leading-none text-[#b62d33]"
        >
          {{ card.badge }}
        </span>

        <h3
          class="m-0 max-w-[19rem] text-[1.24rem] font-semibold leading-[0.96] tracking-[-0.03em] text-white sm:text-[1.34rem]"
        >
          {{ card.title }}
        </h3>
      </div>
    </article>
    }
  </div>
</section>
