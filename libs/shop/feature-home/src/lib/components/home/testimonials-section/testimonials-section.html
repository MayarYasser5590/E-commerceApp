<section
  class="relative -mx-2 left-1/2 w-screen -translate-x-1/2 overflow-hidden bg-rose-50 py-12 md:py-14"
>
  <div class="mx-auto w-full max-w-screen-xl px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col items-center text-center">
      <lib-section-heading-atom
        subtitle="Testimonials"
        title="Real Words from Happy Customers"
        align="center"
      ></lib-section-heading-atom>
    </div>

    <div
      class="mx-auto mt-16 grid max-w-5xl grid-cols-1 gap-x-8 gap-y-14 sm:grid-cols-2 lg:grid-cols-3"
    >
      @for (testimonial of testimonials; track testimonial) {
        <article
          class="relative min-h-52 rounded-lg border border-rose-100 bg-white px-7 pb-6 pt-14 text-center shadow-sm"
          data-testid="testimonial-card"
        >
          <div
            class="absolute left-1/2 top-0 grid size-16 -translate-x-1/2 -translate-y-1/2 place-items-center overflow-hidden rounded-full bg-rose-100 shadow-sm"
          >
            <img
              [ngSrc]="testimonial.avatarSrc"
              [alt]="testimonial.avatarAlt"
              width="72"
              height="72"
              class="size-full object-cover"
            />
          </div>

          <div class="grid justify-items-center gap-3">
            <h3 class="m-0 text-sm font-bold leading-tight text-rose-950">
              {{ testimonial.name }}
            </h3>

            <div
              class="flex justify-center gap-0.5 text-yellow-400"
              [attr.aria-label]="testimonial.rating + ' out of 5 stars'"
            >
              @for (star of stars; track $index) {
                <lucide-angular
                  [img]="StarIcon"
                  [size]="14"
                  class="fill-yellow-400"
                  aria-hidden="true"
                ></lucide-angular>
              }
            </div>

            <p class="m-0 max-w-56 text-xs leading-5 text-stone-700">
              {{ testimonial.quote }}
            </p>
            <p class="m-0 text-xs leading-tight text-stone-400">
              {{ testimonial.date }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
